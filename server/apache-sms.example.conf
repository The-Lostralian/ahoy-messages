# Example Apache virtual host for the SMS endpoint (needs mod_ssl, mod_proxy and mod_proxy_http).
# Only the phone app's four POST endpoints are reachable; everything else is refused before it
# reaches the container. Running behind Cloudflare's proxy is fine: the bodies are encrypted with
# SMS_SHARED_KEY, so Cloudflare sees no message text.

<VirtualHost *:80>
    ServerName sms.example.com
    Redirect permanent / https://sms.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName sms.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    <Location />
        Require all denied
    </Location>
    <LocationMatch "^/sms/(incoming|draft|review|forget)$">
        <LimitExcept POST>
            Require all denied
        </LimitExcept>
        <Limit POST>
            Require all granted
        </Limit>
    </LocationMatch>
    LimitRequestBody 2000000

    # Reviewing a long conversation takes two model runs on a small GPU
    ProxyTimeout 120
    ProxyPass /sms/ http://127.0.0.1:8098/sms/
    ProxyPassReverse /sms/ http://127.0.0.1:8098/sms/
</VirtualHost>
